services:
  1p-practice:
    # Pulls the image GitHub Actions builds and publishes to ghcr.io on every
    # push to main. Replace GITHUB_USERNAME/1p-practice with your actual repo
    # path (lowercase), e.g. ghcr.io/janedoe/1p-practice:latest.
    # If you'd rather build it yourself on this server instead of pulling,
    # comment the "image" line out and uncomment "build: ." below.
    image: ghcr.io/GITHUB_USERNAME/1p-practice:latest
    # build: .
    container_name: 1p-practice
    restart: unless-stopped
    environment:
      - RP_ID=1p-practice.southrock.ie
      - ORIGIN=https://1p-practice.southrock.ie
      - RP_NAME=1Password Practice
      - SESSION_SECRET=${SESSION_SECRET:?set a random long string in .env}
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./data:/app/data
    networks:
      - traefik-network

networks:
  traefik-network:
    external: true
    # change this to match whatever external network your Traefik container
    # publishes (e.g. "proxy", "traefik", "t3_proxy")
